<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}{% endblock %}">
    <meta name="keywords" content="{% block meta_keywords %}{% endblock %}">
    
    <title>{% block title %}Photography Courses{% endblock %}</title>
    
    {% load static %}
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'img/favicon/favicon.png' %}">
    
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <nav>
            <div class="nav-brand">
                <a href="/" class="logo-link">
                    <img src="{% static 'img/logo/logo-dark.png' %}" alt="Going Digital" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline';">
                    <span class="logo-text" style="display: none;">Going Digital</span>
                </a>
            </div>
            <div class="nav-links">
                <a href="{% url 'courses:course_list' %}">Explore Courses</a>
            </div>
        </nav>
    </header>
    
    <main {% block main_attrs %}{% endblock %}>
        {% block content %}{% endblock %}
    </main>
    
    <footer>
        <p>&copy; {% now "Y" %} Photography Courses. All rights reserved.</p>
    </footer>
    
    {% block extra_js %}{% endblock %}
    
    <script>
    // Automatic theme detection based on system preference
    (function() {
        const html = document.documentElement;
        
        // Apply theme based on system preference
        function applySystemTheme() {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                html.setAttribute('data-theme', 'dark');
            } else {
                html.setAttribute('data-theme', 'light');
            }
        }
        
        // Initialize theme
        applySystemTheme();
        
        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
            applySystemTheme();
        });
    })();
    </script>
</body>
</html>
