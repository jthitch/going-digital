<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Something went wrong — Going Digital</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1a1a1a;
            background: #f4f6f8;
        }
        @media (prefers-color-scheme: dark) {
            body { color: #f2f2f2; background: #1a1a1a; }
            .card { background: #2d2d2d; border-color: #404040; }
            .muted { color: #b0b0b0; }
            a.btn { background: #4a9eff; }
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 1.75rem 1.5rem;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            text-align: center;
        }
        h1 { font-size: 1.35rem; margin: 0 0 0.75rem; }
        .muted { color: #555; line-height: 1.5; margin: 0 0 1.25rem; }
        a.btn {
            display: inline-block;
            padding: 0.65rem 1.1rem;
            border-radius: 6px;
            background: #4a9eff;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Something went wrong</h1>
        <p class="muted">
            Sorry — we couldn’t complete that request. Our team has been notified.
            Please try again in a moment, or go back to the homepage.
        </p>
        <a class="btn" href="/">Back to homepage</a>
    </div>
</body>
</html>
