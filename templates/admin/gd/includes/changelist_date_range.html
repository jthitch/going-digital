{% load i18n %}
<div class="gd-changelist-filter-group gd-changelist-date-range">
    <span class="gd-changelist-filter-group__label">{% trans 'Date range' %}</span>
    <div class="gd-changelist-date-range__inputs">
        <input
            type="date"
            name="date_from"
            id="{{ id_prefix }}-date-from"
            class="form-control gd-changelist-filter-input"
            value="{{ request.GET.date_from }}"
            aria-label="{% trans 'From date' %}"
        >
        <span class="gd-changelist-date-range__sep" aria-hidden="true">to</span>
        <input
            type="date"
            name="date_to"
            id="{{ id_prefix }}-date-to"
            class="form-control gd-changelist-filter-input"
            value="{{ request.GET.date_to }}"
            aria-label="{% trans 'To date' %}"
        >
    </div>
    {% if hint %}
    <span class="gd-changelist-filter-group__hint">{{ hint }}</span>
    {% endif %}
</div>
