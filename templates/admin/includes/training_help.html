{% if show %}
<div class="alert alert-light border gd-training-help" role="note">
    <div class="d-flex flex-wrap align-items-start justify-content-between">
        <div class="mb-2 mb-md-0 pr-md-3">
            <strong class="d-block mb-1">
                <i class="fas fa-graduation-cap" aria-hidden="true"></i>
                Need help?
            </strong>
            <ul class="mb-0 pl-3">
                {% for guide in guides %}
                <li>
                    <a href="{{ guide.url }}">{{ guide.title }}</a>
                    {% if guide.summary %}
                    <span class="text-muted"> — {{ guide.summary }}</span>
                    {% endif %}
                </li>
                {% endfor %}
            </ul>
        </div>
        <a href="{{ hub_url }}" class="btn btn-sm btn-outline-secondary">All training guides</a>
    </div>
</div>
{% endif %}
