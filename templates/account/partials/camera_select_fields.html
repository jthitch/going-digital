<div class="camera-select" data-camera-select>
    <div class="booking-form-row booking-form-row--2">
        <div class="form-group">
            <label for="{{ make_id }}">
                Camera make{% if required %} <span class="booking-required" aria-hidden="true">*</span>{% endif %}
            </label>
            <select
                id="{{ make_id }}"
                name="{{ make_name }}"
                class="booking-field-input booking-field-select{% if make_error %} is-invalid{% endif %}"
                data-camera-make
                {% if required %}required{% endif %}
                {% if make_error %}aria-invalid="true"{% endif %}
            >
                {% for value, label in make_choices %}
                <option value="{{ value }}"{% if value == make_value %} selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            {% if make_error %}
            <p class="field-error">{{ make_error }}</p>
            {% endif %}
        </div>
        <div class="form-group">
            <label for="{{ model_id }}">
                Camera model{% if required %} <span class="booking-required" aria-hidden="true">*</span>{% endif %}
            </label>
            <select
                id="{{ model_id }}"
                name="{{ model_name }}"
                class="booking-field-input booking-field-select{% if model_error %} is-invalid{% endif %}"
                data-camera-model
                data-initial-model="{{ model_value }}"
                {% if required %}required{% endif %}
                {% if model_error %}aria-invalid="true"{% endif %}
            >
                <option value="">Select model</option>
            </select>
            {% if model_error %}
            <p class="field-error">{{ model_error }}</p>
            {% endif %}
        </div>
    </div>
    <div class="booking-form-row booking-form-row--2 camera-select__other" data-camera-other-row hidden>
        <div class="form-group" data-camera-make-other-wrap hidden>
            <label for="{{ make_other_id }}">Other make</label>
            <input
                type="text"
                id="{{ make_other_id }}"
                name="{{ make_other_name }}"
                class="booking-field-input"
                value="{{ make_other_value }}"
                placeholder="Enter camera make"
                autocomplete="off"
                data-camera-make-other
            >
        </div>
        <div class="form-group" data-camera-model-other-wrap hidden>
            <label for="{{ model_other_id }}">Other model</label>
            <input
                type="text"
                id="{{ model_other_id }}"
                name="{{ model_other_name }}"
                class="booking-field-input"
                value="{{ model_other_value }}"
                placeholder="Enter camera model"
                autocomplete="off"
                data-camera-model-other
            >
        </div>
    </div>
</div>
