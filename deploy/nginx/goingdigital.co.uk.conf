# Production Nginx vhost for Going Digital.
# Canonical host: https://goingdigital.co.uk (www → apex).
#
# Install:
#   sudo cp deploy/nginx/goingdigital.co.uk.conf /etc/nginx/sites-available/goingdigital.co.uk
#   sudo ln -sf /etc/nginx/sites-available/goingdigital.co.uk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d goingdigital.co.uk -d www.goingdigital.co.uk
#
# Adjust root paths if the app does not live under /var/www/going-digital.

# Redirect www → apex (HTTP; Certbot will add HTTPS equivalents)
server {
    listen 80;
    listen [::]:80;
    server_name www.goingdigital.co.uk;
    return 301 http://goingdigital.co.uk$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name goingdigital.co.uk;

    client_max_body_size 20M;

    location /static/ {
        alias /var/www/going-digital/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location /media/ {
        alias /var/www/going-digital/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
